<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#151b2e"/>
    </linearGradient>

    <!-- Shield & Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f293d"/>
      <stop offset="100%" stop-color="#111625"/>
    </linearGradient>

    <radialGradient id="ambient-cyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ambient-violet" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <!-- Filter for subtle drop-shadow/glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  <rect width="1200" height="630" fill="url(#ambient-cyan)"/>
  <rect width="1200" height="630" fill="url(#ambient-violet)"/>

  <!-- Subtle Cyber Tech Grid Pattern -->
  <g opacity="0.08" stroke="#00E5FF" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Outer Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="none" stroke="url(#primary-glow)" stroke-width="1" opacity="0.4"/>

  <!-- Content Group -->
  <g transform="translate(100, 115)">
    <!-- Shield Icon Illustration with Glowing Ring -->
    <g transform="translate(0, 30)">
      <!-- Outer Glow Ring -->
      <circle cx="90" cy="120" r="110" fill="none" stroke="url(#primary-glow)" stroke-width="2" opacity="0.4" stroke-dasharray="12 6" />
      <circle cx="90" cy="120" r="95" fill="#131b2c" stroke="rgba(0, 229, 255, 0.3)" stroke-width="2" />
      
      <!-- Shield Path -->
      <path d="M90 60 L145 85 C145 140 120 175 90 195 C60 175 35 140 35 85 Z" 
            fill="url(#shield-grad)" 
            stroke="url(#primary-glow)" 
            stroke-width="4" 
            filter="url(#glow)"/>

      <!-- Inner Shield Core / Checkmark Shield -->
      <path d="M90 75 L130 95 C130 135 110 162 90 178 C70 162 50 135 50 95 Z" 
            fill="none" 
            stroke="#00E5FF" 
            stroke-width="2" 
            opacity="0.8"/>
            
      <!-- Shield Center Lock / Check Emblem -->
      <path d="M76 122 L86 132 L106 108" fill="none" stroke="#45dfa4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Text Information -->
    <g transform="translate(260, 45)">
      <!-- Top Status Badge -->
      <g>
        <rect x="0" y="0" width="270" height="36" rx="18" fill="#171b29" stroke="#45dfa4" stroke-width="1.2" stroke-opacity="0.6"/>
        <circle cx="20" cy="18" r="5" fill="#45dfa4"/>
        <text x="36" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#45dfa4" letter-spacing="1.5">ZERO-TRUST AIR GAP</text>
      </g>

      <!-- Main Title: KAVACH -->
      <text x="0" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Space Grotesk', 'Segoe UI', sans-serif" font-size="82" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
        Kavach
      </text>

      <!-- Tagline -->
      <text x="2" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="600" fill="#00E5FF" letter-spacing="0.5">
        AI Security Gateway &amp; Threat Interception
      </text>

      <!-- Value Props Description -->
      <text x="2" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#94A3B8">
        Real-time prompt injection detection, PII sanitization, and deterministic RBAC policy enforcement.
      </text>

      <!-- Feature Pill Badges -->
      <g transform="translate(0, 260)">
        <!-- Pill 1 -->
        <rect x="0" y="0" width="220" height="38" rx="10" fill="#171b29" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <text x="18" y="24" font-family="monospace" font-size="13" font-weight="600" fill="#a78bfa">⚡ &lt;15ms Latency Budget</text>

        <!-- Pill 2 -->
        <rect x="235" y="0" width="220" height="38" rx="10" fill="#171b29" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <text x="253" y="24" font-family="monospace" font-size="13" font-weight="600" fill="#44e2cd">🛡️ PII Masking (Aadhaar/PAN)</text>

        <!-- Pill 3 -->
        <rect x="470" y="0" width="220" height="38" rx="10" fill="#171b29" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <text x="488" y="24" font-family="monospace" font-size="13" font-weight="600" fill="#fbbf24">🔒 Zero Log Retention</text>
      </g>
    </g>
  </g>
</svg>
